version: '3.8'

services:
  clawmentor-bharat:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: clawmentor-bharat
    restart: unless-stopped
    ports:
      - "18789:18789"      # OpenClaw Gateway
      - "8080:8080"        # Live Canvas UI
    volumes:
      - ./memory:/home/node/.openclaw/memory
      - ./skills:/home/node/.openclaw/skills
      - ./openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - openclaw_data:/home/node/.openclaw/data
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OLLAMA_HOST=host.docker.internal
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

volumes:
  openclaw_data:
